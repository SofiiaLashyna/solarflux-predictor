spring:
  application:
    name: solarflux-core-api
  datasource:
    url: jdbc:postgresql://localhost:5433/solarflux
    username: solarflux
    password: changeme
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: solarflux-core-api
      auto-offset-reset: latest
    producer:
      properties:
        max.block.ms: 5000

server:
  port: 8080

forecast:
  service-url: http://127.0.0.1:8000
  models: persistence,chronos-bolt-small,timesfm-2.5-200m,chronos-t5-small
  horizon: 8
  context-length: 512

logging:
  level:
    com.sofiia.solarflux: DEBUG